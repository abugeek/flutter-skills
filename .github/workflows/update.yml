name: update-skills
on:
  schedule: [{cron: "0 6 * * 1"}]   # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Refresh sources, regenerate, check
        run: python3 update.py
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated .claude/skills/flutter-skills-index UPDATE_REPORT.md
          git diff --cached --quiet || (git commit -m "chore: weekly skills refresh" && git push)
      - name: Open/update issue when action is needed
        if: ${{ hashFiles('UPDATE_REPORT.md') != '' }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          grep -q "## Action needed" UPDATE_REPORT.md || exit 0
          n=$(gh issue list --state open --search "Skills update report in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file UPDATE_REPORT.md
          else gh issue create --title "Skills update report" --body-file UPDATE_REPORT.md; fi
